name: Final visual QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: final-visual-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test && npm run qa:hdri && npm run qa:interior && npm run build
  visual-evidence:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: low
            tier: low
            video: '0'
          - name: high
            tier: high
            video: '0'
          - name: tour
            tier: low
            video: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium ffmpeg
      - run: npm run build
      - name: Capture verified frames (fixed tier before first render)
        run: npm run qa:runtime
        env:
          QA_TIER: ${{ matrix.tier }}
          QA_BUTTON: ${{ matrix.name == 'low' && '1' || '0' }}
          QA_VIDEO: ${{ matrix.video }}
          QA_SOURCE_SHA: ${{ github.sha }}
          QA_DIR: artifacts/phase6/${{ matrix.name }}
          QA_WIDTH: '1440'
          QA_HEIGHT: '900'
          QA_TIMEOUT: '600000'
      - name: Upload evidence including partial failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-phase6-${{ matrix.name }}
          path: artifacts/phase6
          if-no-files-found: error
          retention-days: 30
