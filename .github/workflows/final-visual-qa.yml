name: Final visual QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      run_visual: ${{ steps.qa-scope.outputs.run_visual }}
      visual_matrix: ${{ steps.qa-scope.outputs.visual_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve evidence scope
        id: qa-scope
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          head_message="$(git show -s --format=%B "$HEAD_SHA")"
          if [[ "$head_message" == *"[qa:static]"* ]]; then
            echo 'run_visual=false' >> "$GITHUB_OUTPUT"
            echo 'visual_matrix=["screenshots","video"]' >> "$GITHUB_OUTPUT"
          elif [[ "$head_message" == *"[qa:probes]"* ]]; then
            echo 'run_visual=true' >> "$GITHUB_OUTPUT"
            echo 'visual_matrix=["probes"]' >> "$GITHUB_OUTPUT"
          else
            echo 'run_visual=true' >> "$GITHUB_OUTPUT"
            echo 'visual_matrix=["screenshots","video"]' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: |
          npm run lint
          npm test
          npm run qa:hdri
          npm run qa:interior
          npm run build

  visual-evidence:
    needs: static-checks
    if: needs.static-checks.outputs.run_visual == 'true'
    runs-on: ubuntu-latest
    # Full-resolution High screenshots take ~47 minutes on GitHub's shared
    # SwiftShader runner. The recorded tour is independent evidence, so run
    # both modes in parallel with isolated time budgets and reports.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.static-checks.outputs.visual_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install media tools
        if: matrix.mode == 'video'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build production bundle
        run: npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/meridian-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/boeing-747/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/meridian-preview.log
          exit 1

      - name: Capture final product
        run: npm run qa:visual
        env:
          VISUAL_QA_MODE: ${{ matrix.mode }}

      - name: Cut short MP4 clips
        if: matrix.mode == 'video'
        run: npm run qa:clips

      - name: Archive preview log
        if: always()
        run: |
          mkdir -p artifacts/final-visuals
          cp /tmp/meridian-preview.log artifacts/final-visuals/preview.log

      - name: Upload screenshots and clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-final-visuals-${{ matrix.mode }}
          path: artifacts/final-visuals
          if-no-files-found: error
          retention-days: 30
