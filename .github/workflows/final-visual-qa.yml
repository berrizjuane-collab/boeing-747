name: Final visual QA
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'plan6.md'
      - 'progress6.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: final-visual-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test && npm run qa:hdri && npm run qa:interior && npm run build

  quality-sweep:
    needs: static-checks
    runs-on: ubuntu-latest
    # Measured with the runner's two cores emulated locally (taskset); see
    # docs/evidence/round6/inspeccion. The margin is for runner variance.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Route sweeps check counters, budgets, resources and progress in
        # both directions, none of which depend on resolution, so they run
        # at 960x600. Editorial captures, which are about the picture, keep
        # 1440x900 in their own job instead of sharing one with a sweep.
        include:
          - name: low
            tier: low
            sweep: '1'
            cycles: '1'
            tier_cache: '1'
            captures: none
            width: '960'
            height: '600'
          - name: mid
            tier: mid
            sweep: '1'
            cycles: '0'
            tier_cache: '0'
            captures: none
            width: '960'
            height: '600'
          - name: high
            tier: high
            sweep: '1'
            cycles: '0'
            tier_cache: '0'
            captures: none
            width: '960'
            height: '600'
          - name: high-editorial
            tier: high
            sweep: '0'
            cycles: '0'
            tier_cache: '0'
            captures: opening,takeoff-first,takeoff-roll,takeoff-end,climb-entry,spec,threshold,cockpit,economy,stair,upper,exit-opening,exit-middle,exit-end,departure,footer
            width: '1440'
            height: '900'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run the ${{ matrix.name }} route check
        run: npm run qa:runtime
        env:
          QA_TIER: ${{ matrix.tier }}
          QA_CYCLES: ${{ matrix.cycles }}
          QA_TIER_CACHE: ${{ matrix.tier_cache }}
          QA_SWEEP: ${{ matrix.sweep }}
          QA_SWEEP_STEP: '0.01'
          QA_REDUCED_MOTION: '1'
          QA_CAPTURES: ${{ matrix.captures }}
          QA_SOURCE_SHA: ${{ github.sha }}
          QA_DIR: artifacts/phase7/${{ matrix.name }}
          QA_WIDTH: ${{ matrix.width }}
          QA_HEIGHT: ${{ matrix.height }}
          QA_TIMEOUT: '300000'
      - name: Retain route measurements
        if: always()
        # Evidence, not the verdict: the check above is what gates Pages.
        # An exhausted artifact quota must not turn a passing run red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: meridian-phase7-${{ matrix.name }}-report
          path: |
            artifacts/phase7/${{ matrix.name }}/report.json
            artifacts/phase7/${{ matrix.name }}/failure.png
          if-no-files-found: error
          retention-days: 14

      - name: Retain High editorial captures for visual review
        if: always() && matrix.name == 'high-editorial'
        # Evidence, not the verdict: the check above is what gates Pages.
        # An exhausted artifact quota must not turn a passing run red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: meridian-phase7-high-editorial-captures
          path: artifacts/phase7/high-editorial/*.png
          if-no-files-found: error
          retention-days: 14

  dynamic-tour:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Scroll continuously from 0 to 100 percent and back
        run: npm run qa:runtime
        env:
          QA_TIER: low
          QA_VIDEO: '1'
          QA_RECORD_VIDEO: '1'
          QA_CAPTURES: none
          QA_SOURCE_SHA: ${{ github.sha }}
          QA_DIR: artifacts/phase8/dynamic-tour
          QA_WIDTH: '960'
          QA_HEIGHT: '640'
          QA_TIMEOUT: '300000'
      - name: Retain movement report and full-route video
        if: always()
        # Evidence, not the verdict: the check above is what gates Pages.
        # An exhausted artifact quota must not turn a passing run red.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: meridian-phase8-tour-report
          path: |
            artifacts/phase8/dynamic-tour/report.json
            artifacts/phase8/dynamic-tour/*.webm
            artifacts/phase8/dynamic-tour/failure.png
          if-no-files-found: error
          retention-days: 14
