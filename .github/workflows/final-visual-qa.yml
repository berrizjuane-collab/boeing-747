name: Final visual QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-visual-qa:
    runs-on: ubuntu-latest
    # SwiftShader screenshots intentionally wait for real shader completion;
    # leave headroom for slower shared runners instead of truncating evidence.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and media tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Static checks
        run: |
          npm run lint
          npm test
          npm run qa:hdri
          npm run qa:interior
          npm run build

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/meridian-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/boeing-747/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/meridian-preview.log
          exit 1

      - name: Capture final product
        run: npm run qa:visual

      - name: Cut short MP4 clips
        run: |
          # Playwright records the mandatory 55 s SwiftShader warm-up too.
          # Seek from EOF so clips target the animated tour despite variable
          # load/compile times on CI runners.
          ffmpeg -y -sseof -00:00:22 -i artifacts/final-visuals/meridian-complete-tour.webm -t 00:00:06 -an -c:v libx264 -crf 22 -pix_fmt yuv420p -movflags +faststart artifacts/final-visuals/clip-01-exterior.mp4
          ffmpeg -y -sseof -00:00:15 -i artifacts/final-visuals/meridian-complete-tour.webm -t 00:00:06 -an -c:v libx264 -crf 22 -pix_fmt yuv420p -movflags +faststart artifacts/final-visuals/clip-02-threshold.mp4
          ffmpeg -y -sseof -00:00:08 -i artifacts/final-visuals/meridian-complete-tour.webm -t 00:00:07 -an -c:v libx264 -crf 22 -pix_fmt yuv420p -movflags +faststart artifacts/final-visuals/clip-03-interior-outro.mp4

      - name: Archive preview log
        if: always()
        run: |
          mkdir -p artifacts/final-visuals
          cp /tmp/meridian-preview.log artifacts/final-visuals/preview.log

      - name: Upload screenshots and clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meridian-final-visuals
          path: artifacts/final-visuals
          if-no-files-found: error
          retention-days: 30
